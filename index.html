<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDLE</title>
<meta name="description" content="IDLE turns the free gaps in a high school student's day into quests. Try the app.">
<meta property="og:title" content="IDLE: free time, turned into quests">
<meta property="og:description" content="Mo lives in your Dynamic Island and wakes up when a gap in your day starts. Try the app.">
<meta property="og:image" content="https://beansgreens12313.github.io/idle/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F7FAFE">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IDLE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="mo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="shots/napping.webp" as="image">
<link rel="preload" href="shots/gapAlert.webp" as="image">
<style>
  @font-face { font-family: Nunito; font-weight: 400; font-display: swap; src: url(fonts/Nunito_400Regular.woff) format("woff"); }
  @font-face { font-family: Nunito; font-weight: 700; font-display: swap; src: url(fonts/Nunito_700Bold.woff) format("woff"); }
  @font-face { font-family: Nunito; font-weight: 900; font-display: swap; src: url(fonts/Nunito_900Black.woff) format("woff"); }
  /* IDLE's own colors (DESIGN.md) */
  :root {
    --bg: #F7FAFE; --ink: #2A3445; --muted: #5E6B80; --blue: #3B7DD8; --deep: #1E4E8C;
    --tint: #E6F0FB; --gold: #E8B84A; --bezel: #0F1B2D;
    --ph: min(86vh, 880px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: Nunito, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  }
  body::before {
    content: ""; position: fixed; width: 70vmax; height: 70vmax; right: -18vmax; top: 18vh;
    border-radius: 50%; background: var(--tint); z-index: -1;
  }
  .app {
    height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(300px, 420px) auto;
    grid-template-areas: "side stage"; justify-content: center; align-items: center;
    gap: clamp(32px, 7vw, 110px); padding: 24px 32px;
  }

  /* the side panel: brand, what to do next, credits */
  .side { grid-area: side; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 74px; height: auto; }
  .brand h1 { margin: 0; font-size: 64px; font-weight: 900; color: var(--deep); letter-spacing: 0.02em; line-height: 1; }
  .brand small { display: none; }
  .tagline { margin: 14px 0 0; font-size: 24px; font-weight: 900; line-height: 1.2; }
  .tagline b { color: var(--blue); }
  .card {
    margin-top: 34px; background: #fff; border-radius: 26px; padding: 24px 26px;
    box-shadow: 0 1px 0 rgba(30, 78, 140, 0.06), 0 14px 34px rgba(30, 78, 140, 0.10);
  }
  .label { font-size: 13px; font-weight: 900; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  .hint { margin: 8px 0 0; font-size: 23px; font-weight: 900; color: var(--deep); line-height: 1.25; }
  .note { margin: 10px 0 0; font-size: 17px; line-height: 1.45; }
  .restart {
    margin-top: 20px; font: inherit; font-weight: 900; font-size: 16px; color: var(--deep); background: var(--tint);
    border: 0; border-radius: 14px; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    touch-action: manipulation;
  }
  .restart svg { width: 18px; height: 18px; }
  .restart:active { transform: translateY(1px); }
  .credit { margin-top: 26px; font-size: 14px; line-height: 1.5; color: var(--muted); font-weight: 700; }

  /* the phone */
  .stage { grid-area: stage; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .phone {
    position: relative; box-sizing: content-box; height: calc(var(--ph) * 0.973); aspect-ratio: 860 / 1864;
    border-radius: 13.5% / 6.2%; padding: calc(var(--ph) * 0.0135); background: var(--bezel);
    box-shadow: 0 0 0 2px #2B3A52 inset, 0 34px 80px rgba(30, 78, 140, 0.28);
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 11.5% / 5.3%; overflow: hidden;
    background: var(--bg); isolation: isolate; transform: translateZ(0); cursor: default;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .shot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
  .shot.edge { box-shadow: -12px 0 30px rgba(15, 27, 45, 0.18); }
  .spot {
    position: absolute; z-index: 5; border: 0; padding: 0; margin: 0; background: transparent; border-radius: 16px;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background 0.12s ease;
  }
  .spot.pressed { background: rgba(15, 27, 45, 0.12); }
  .spot.round { border-radius: 999px; }
  .spot:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ring {
    position: absolute; z-index: 4; pointer-events: none; border-radius: 16px;
    animation: ring 1.7s ease-out infinite;
  }
  .ring.round { border-radius: 999px; }
  .ring.nudge { animation: nudge 0.5s ease, ring 1.7s ease-out 0.5s infinite; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 3px rgba(232, 184, 74, 0.95), 0 0 0 0 rgba(232, 184, 74, 0.55); }
    100% { box-shadow: 0 0 0 3px rgba(232, 184, 74, 0.95), 0 0 0 16px rgba(232, 184, 74, 0); }
  }
  @keyframes nudge {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(232, 184, 74, 1); }
    40% { transform: scale(1.06); box-shadow: 0 0 0 5px rgba(232, 184, 74, 1); }
  }

  /* phones: the app fills the screen, the hint sits underneath */
  @media (max-width: 820px) {
    body::before { top: 30vh; }
    .app {
      grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto auto;
      grid-template-areas: "brand" "stage" "card" "credit"; justify-items: center; gap: 8px;
      padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
    }
    .side { display: contents; }
    .brand { grid-area: brand; gap: 8px; }
    .brand img { width: 38px; }
    .brand h1 { font-size: 28px; }
    .brand small { display: block; font-size: 13px; font-weight: 800; color: var(--muted); margin-left: 4px; padding-top: 6px; }
    .tagline, .label, .note { display: none; }
    .stage { height: 100%; width: 100%; }
    .phone { height: calc(100% - 12px); max-height: 748px; padding: 6px; }
    .card {
      grid-area: card; margin: 0; width: 100%; max-width: 460px; padding: 12px 12px 12px 18px; border-radius: 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .hint { margin: 0; flex: 1; font-size: 16px; line-height: 1.3; }
    .restart { margin: 0; padding: 10px 12px; font-size: 14px; }
    .restart span { display: none; }
    .credit { grid-area: credit; margin: 0; font-size: 11px; line-height: 1.35; text-align: center; max-width: 460px; }
  }
  /* phones on their side and short laptop windows: phone on the right, compact panel on the left */
  @media (orientation: landscape) and (max-height: 600px) {
    :root { --ph: calc(100dvh - 24px); }
    .app {
      grid-template-columns: minmax(0, 320px) auto; grid-template-rows: none; grid-template-areas: "side stage";
      justify-items: stretch; gap: 24px; padding: 12px 20px;
    }
    .side { display: block; }
    .brand small, .tagline, .label, .note { display: none; }
    .brand img { width: 40px; }
    .brand h1 { font-size: 32px; }
    .card { display: block; margin-top: 12px; padding: 14px 16px; }
    .hint { font-size: 16px; }
    .restart { margin-top: 10px; }
    .restart span { display: inline; }
    .credit { display: block; margin-top: 10px; font-size: 11px; text-align: left; }
    .stage { height: auto; }
    .phone { height: calc(var(--ph) * 0.973); max-height: none; padding: calc(var(--ph) * 0.0135); }
  }
  @media (prefers-reduced-motion: reduce) {
    .ring, .ring.nudge { animation: none; box-shadow: 0 0 0 3px rgba(232, 184, 74, 0.95); }
  }
</style>
</head>
<body>
<main class="app">
  <aside class="side">
    <div class="brand"><img src="mo.svg" alt=""><h1>IDLE</h1><small>iPhone app preview</small></div>
    <p class="tagline">Free time, turned into <b>quests</b>.</p>
    <section class="card" aria-live="polite">
      <div class="label">Try it</div>
      <p class="hint" id="hint"></p>
      <p class="note" id="note"></p>
      <button class="restart" id="restart" aria-label="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span>Start over</span>
      </button>
    </section>
    <p class="credit">Made by Jaiden George, Shubh Jain and Sam Tong for the Congressional App Challenge 2026, Maryland's 3rd District. An interactive preview made from real screens of the IDLE iPhone app.</p>
  </aside>
  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>
  </div>
</main>
<script>
  // Spots are the real buttons on each screenshot, as fractions of the screen: x [left, right], y [top, bottom].
  // how: push / pop slide like iOS navigation, open zooms like launching an app, tab and fade cross-fade.
  const ISLAND = { x: [0.20, 0.80], y: [0.008, 0.062], round: true };
  const ICON = { x: [0.76, 0.935], y: [0.20, 0.292], to: "today", how: "open", label: "Open IDLE" };
  const TABS = [
    { x: [0, 0.23], y: [0.905, 1], to: "today", how: "tab", label: "Today tab" },
    { x: [0.23, 0.42], y: [0.905, 1], to: "goals", how: "tab", label: "Goals tab" },
    { x: [0.42, 0.58], y: [0.885, 1], to: "chat", how: "tab", label: "Chat with Mo", round: true },
    { x: [0.58, 0.78], y: [0.905, 1], to: "recap", how: "tab", label: "Recap tab" },
    { x: [0.78, 1], y: [0.905, 1], to: "you", how: "tab", label: "You tab" },
  ];
  const SCREENS = {
    napping: {
      alt: "iPhone home screen with Mo asleep in the Dynamic Island",
      hint: "Mo is napping until your next free gap...",
      note: "While you're in class or at practice, Mo sleeps in the Dynamic Island.",
      spots: [{ ...ISLAND, to: "gapAlert", how: "fade", label: "Mo in the Dynamic Island" }, ICON],
    },
    gapAlert: {
      alt: "Mo awake in the Dynamic Island showing 25 minutes free",
      hint: "A free gap starts and Mo wakes up: 25 minutes free. Tap Mo to open IDLE.",
      note: "Mo wakes up when a free stretch of 15 minutes or more begins.",
      spots: [{ ...ISLAND, to: "today", how: "open", label: "Mo in the Dynamic Island", guide: true }, ICON],
    },
    questFound: {
      alt: "Quest found: catch up on 3 Spanish flashcard decks",
      hint: "Mo found a quest that fits. Tap Start quest.",
      note: "Each quest fits the time you have and counts toward a weekly goal: health, school, relationships or learning.",
      spots: [
        { x: [0.04, 0.96], y: [0.812, 0.898], to: "questTimer", how: "push", label: "Start quest", guide: true },
        { x: [0.02, 0.18], y: [0.062, 0.118], to: "today", how: "pop", label: "Back" },
      ],
    },
    questTimer: {
      alt: "Quest timer counting down for Spanish flashcards",
      hint: "The quest is running. Tap Done to finish.",
      note: "Done pays 1 XP for every minute you spent. The countdown also runs right in the Dynamic Island.",
      spots: [
        { x: [0.04, 0.96], y: [0.816, 0.898], to: "questClear", how: "push", label: "Done", guide: true },
        { x: [0.33, 0.67], y: [0.905, 0.962], to: "today", how: "pop", label: "Stop quest" },
      ],
    },
    questClear: {
      alt: "Quest clear: 25 minutes reclaimed, plus 25 XP, plus 10 Sparks",
      hint: "Quest clear! Tap Back to Today.",
      note: "The full 25 minutes: 25 XP, 10 Sparks, and a 25-point hit on the Spanish quiz boss.",
      spots: [{ x: [0.04, 0.96], y: [0.884, 0.962], to: "today", how: "pop", label: "Back to Today", guide: true }],
    },
    today: {
      alt: "Today: the day's free gaps as quests",
      hint: () => (cleared ? "Now explore: tap the tabs, or Mo in the middle." : "Every free gap is a quest. Tap the 25-minute one."),
      note: "IDLE reads your calendar and finds every free stretch of 15 minutes or more.",
      spots: [
        { x: [0.715, 0.945], y: [0.322, 0.398], to: "questTimer", how: "push", label: "Start the 25 minute quest" },
        { x: [0.15, 0.715], y: [0.322, 0.398], to: "questFound", how: "push", label: "25 minutes free: Spanish flashcards", guide: () => !cleared },
        { x: [0.155, 0.965], y: [0.795, 0.85], to: "chat", how: "push", label: "Plan it with Mo" },
        ...TABS.map((t) => (t.to === "chat" ? { ...t, guide: () => cleared } : t)),
      ],
    },
    chat: {
      alt: "Chatting with Mo about a free gap",
      hint: "Mo plans your free time with you. Tap a tab to keep exploring.",
      note: "Mo knows your calendar, and the chat runs on your phone.",
      spots: TABS,
    },
    recap: {
      alt: "Recap: 4 hours 30 minutes reclaimed this week",
      hint: "Recap: the time you took back this week.",
      note: "It shows how each goal is going and how close you are to beating your quiz boss.",
      spots: TABS,
    },
    goals: {
      alt: "Goals: this week's targets and boss battles",
      hint: "Weekly goals for each area.",
      note: "Quizzes become bosses you beat with study quests.",
      spots: TABS,
    },
    you: {
      alt: "Make it yours: Mo's name, color and closet",
      hint: "Mo's name, color and closet are yours to pick. Tap a tab to keep exploring.",
      note: "Name him, pick his color, and dress him up from his closet.",
      spots: TABS,
    },
  };

  const screen = document.getElementById("screen");
  const hintEl = document.getElementById("hint"), noteEl = document.getElementById("note");
  const EASE = "cubic-bezier(0.2, 0.8, 0.2, 1)";
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const val = (v) => (typeof v === "function" ? v() : v);
  const pct = (n) => `${(n * 100).toFixed(2)}%`;

  let current = null, busy = false, cleared = false, gapTimer = 0, ring = null;

  // Load every screen up front so taps never wait on the network. Never wait more than 1.5 s for one.
  const loaded = {};
  for (const name of Object.keys(SCREENS)) {
    const im = new Image();
    const ready = new Promise((res) => { im.onload = res; im.onerror = res; });
    im.src = `shots/${name}.webp`;
    loaded[name] = Promise.race([im.complete ? Promise.resolve() : ready, new Promise((r) => setTimeout(r, 1500))]);
  }

  function animate(oldEl, newEl, how, origin) {
    if (!oldEl) return Promise.resolve();
    if (reduceMotion()) how = "tab";
    const runs = [];
    if (how === "push") {
      newEl.classList.add("edge");
      runs.push(newEl.animate([{ transform: "translateX(100%)" }, { transform: "translateX(0)" }], { duration: 400, easing: EASE }));
      runs.push(oldEl.animate([{ transform: "translateX(0)", filter: "brightness(1)" }, { transform: "translateX(-30%)", filter: "brightness(0.9)" }],
        { duration: 400, easing: EASE, fill: "forwards" }));
    } else if (how === "pop") {
      oldEl.style.zIndex = 2;
      oldEl.classList.add("edge");
      runs.push(oldEl.animate([{ transform: "translateX(0)" }, { transform: "translateX(100%)" }], { duration: 360, easing: EASE, fill: "forwards" }));
      runs.push(newEl.animate([{ transform: "translateX(-30%)", filter: "brightness(0.9)" }, { transform: "translateX(0)", filter: "brightness(1)" }],
        { duration: 360, easing: EASE }));
    } else if (how === "open") {
      newEl.style.transformOrigin = origin;
      runs.push(newEl.animate([{ transform: "scale(0.12)", opacity: 0, borderRadius: "40px" }, { transform: "scale(1)", opacity: 1, borderRadius: "0px" }],
        { duration: 440, easing: EASE }));
      runs.push(oldEl.animate([{ transform: "scale(1)" }, { transform: "scale(1.08)" }], { duration: 440, easing: EASE, fill: "forwards" }));
    } else {
      runs.push(newEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: how === "fade" ? 520 : 200, easing: "ease" }));
    }
    // Hidden pages pause animations, so never wait on them for more than a moment.
    const settled = Promise.all(runs.map((r) => r.finished.catch(() => {})));
    return Promise.race([settled, new Promise((r) => setTimeout(r, 700))]).then(() => runs.forEach((r) => r.cancel()));
  }

  async function go(to, how = "tab", origin = "50% 50%") {
    if (busy || to === current) return;
    busy = true;
    clearTimeout(gapTimer);
    const refocus = screen.contains(document.activeElement);
    clearSpots();
    await loaded[to];
    const el = new Image();
    el.className = "shot";
    el.src = `shots/${to}.webp`;
    el.alt = SCREENS[to].alt;
    el.draggable = false;
    await Promise.race([el.decode ? el.decode().catch(() => {}) : null, new Promise((r) => setTimeout(r, 250))]);
    const oldEl = screen.querySelector(".shot:last-of-type");
    screen.appendChild(el);
    await animate(oldEl, el, how, origin);
    if (oldEl) oldEl.remove();
    el.classList.remove("edge");
    current = to;
    if (to === "questClear") cleared = true;
    render();
    if (refocus) (screen.querySelector(".spot[data-guide]") || screen.querySelector(".spot") || screen).focus();
    busy = false;
  }

  function clearSpots() {
    screen.querySelectorAll(".spot, .ring").forEach((n) => n.remove());
    ring = null;
  }

  function place(node, s) {
    node.style.left = pct(s.x[0]);
    node.style.top = pct(s.y[0]);
    node.style.width = pct(s.x[1] - s.x[0]);
    node.style.height = pct(s.y[1] - s.y[0]);
    if (s.round) node.classList.add("round");
  }

  function render() {
    const sc = SCREENS[current];
    hintEl.textContent = val(sc.hint);
    noteEl.textContent = sc.note;
    for (const s of sc.spots) {
      const b = document.createElement("button");
      b.className = "spot";
      if (val(s.guide)) b.dataset.guide = "";
      b.setAttribute("aria-label", s.label);
      place(b, s);
      const press = () => b.classList.add("pressed"), release = () => b.classList.remove("pressed");
      b.addEventListener("pointerdown", press);
      b.addEventListener("pointerup", release);
      b.addEventListener("pointerleave", release);
      b.addEventListener("pointercancel", release);
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        go(s.to, s.how, `${pct((s.x[0] + s.x[1]) / 2)} ${pct((s.y[0] + s.y[1]) / 2)}`);
      });
      screen.appendChild(b);
      if (val(s.guide)) {
        ring = document.createElement("div");
        ring.className = "ring";
        place(ring, s);
        screen.appendChild(ring);
      }
    }
    if (current === "napping") gapTimer = setTimeout(() => go("gapAlert", "fade"), 2600);
  }

  // A tap that misses every button points at the one to try.
  screen.addEventListener("click", () => {
    if (!ring) return;
    ring.classList.remove("nudge");
    void ring.offsetWidth;
    ring.classList.add("nudge");
  });

  document.getElementById("restart").addEventListener("click", () => {
    if (busy || current === "napping") return;
    cleared = false;
    go("napping", "tab");
  });

  go("napping");

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
